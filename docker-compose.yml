###################################################################
#                 Architecture - 6 core containers
####################################################################
#                            Browser
#                               │
#                               ▼
#                        ┌──────────────┐
#                        │  1. Web      │
#                        │  React/Vite  │
#                        └──────┬───────┘
#                               │ tRPC
#                               ▼
#                        ┌──────────────┐
#                        │ 2. Server    │
#                        │ Node + tRPC  │
#                        └──────┬───────┘
#                               │
#              ┌────────────────┼─────────────────┐
#              │                │                 │
#              ▼                ▼                 ▼
#      ┌──────────────┐  ┌──────────────┐  ┌──────────────┐
#      │ 4. Postgres  │  │ 5. Redis     │  │ 6. RustFS    │
#      │ + pgvector   │  │    BullMQ    │  │ File storage │
#      └──────────────┘  └──────┬───────┘  └──────────────┘
#                               │
#                               ▼
#                        ┌──────────────┐
#                        │ 3. Worker    │
#                        │ Node/BullMQ  │
#                        └──────────────┘
#
#          Server / Worker
#                 │
#                 ▼
#          External LLM APIs
#         OpenAI / Gemini / etc.
####################################################################

services:
  # =========================================================
  # React Frontend
  # =========================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: enterprise-copilot-web

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://server:3000

    depends_on:
      - server

    restart: unless-stopped


  # =========================================================
  # tRPC / Node.js Backend
  # =========================================================
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: enterprise-copilot-server

    command: pnpm --filter server dev

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: development

      FORCE_COLOR: "1"

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      REDIS_URL: redis://redis:6379

      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-enterprise-copilot}
      AWS_REGION: eu-central-1
      AWS_DEFAULT_REGION: eu-central-1

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      rustfs-init:
        condition: service_completed_successfully

    restart: unless-stopped


  # =========================================================
  # BullMQ Background Worker
  # =========================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: enterprise-copilot-worker

    command: pnpm --filter worker dev

    env_file:
      - .env

    environment:
      NODE_ENV: development

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      REDIS_URL: redis://redis:6379

      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-enterprise-copilot}
      AWS_REGION: eu-central-1
      AWS_DEFAULT_REGION: eu-central-1

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      rustfs-init:
        condition: service_completed_successfully

    restart: unless-stopped


  # =========================================================
  # PostgreSQL + pgvector
  # =========================================================
  postgres:
    image: pgvector/pgvector:pg17
    container_name: enterprise-copilot-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # =========================================================
  # Redis - BullMQ / cache / rate limiting
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: enterprise-copilot-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  # =========================================================
  # RustFS - local S3-compatible file storage
  # =========================================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: enterprise-copilot-rustfs
    command: [ "/data" ]

    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: eu-central-1
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: http://localhost:9001,http://127.0.0.1:9001

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - rustfs_data:/data

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/health/ready" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    restart: unless-stopped

  # One-shot setup: create the bucket if missing and allow browser uploads.
  rustfs-init:
    image: amazon/aws-cli
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: eu-central-1
      AWS_EC2_METADATA_DISABLED: "true"
      S3_BUCKET: ${S3_BUCKET:-enterprise-copilot}
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-ec" ]
    command:
      - |
        if ! aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null; then
          aws --endpoint-url http://rustfs:9000 s3api create-bucket \
            --bucket "$$S3_BUCKET" \
            --create-bucket-configuration LocationConstraint=eu-central-1
        fi
        aws --endpoint-url http://rustfs:9000 s3api put-bucket-cors \
          --bucket "$$S3_BUCKET" \
          --cors-configuration '{"CORSRules":[{"AllowedOrigins":["http://localhost:5173","http://127.0.0.1:5173"],"AllowedMethods":["PUT","GET","HEAD"],"AllowedHeaders":["content-type"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3600}]}'
    restart: "no"


# =========================================================
# Persistent Docker Volumes
# =========================================================
volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  # Legacy LocalStack volume retained; its objects are not migrated to RustFS.
  localstack_data:


